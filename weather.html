<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Country Info</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #1F4E79; }
    #result { background: #f7f9fc; border: 1px solid #d0dff0; border-radius: 8px; padding: 20px; margin-top: 20px; }
    button { background: #2E75B6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1F4E79; }
  </style>
</head>
<body>

<h1>Weather Info</h1>
<input type="text" id="cityInput" placeholder="Enter a city">
<button onclick="getWeather()">Search</button>
<div id="result">Enter a city name above and click Search.</div>

<script>
async function getWeather() {
const city = document.getElementById("cityInput").value.trim();

    if (!city) {
        document.getElementById("result").innerHTML = "Please enter a city name.";
        return;
    }
    
    document.getElementById("result").innerHTML = "Loading...";
    
    try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=a4d141edbf5c40140b7427c08d7f0024&units=metric`);
    
        if (!response.ok) {
        throw new Error(`City not found (${response.status})`);
        }
    
        const data = await response.json();
        const name = data.name;
        const temperature = data.main.temp;
        const description = data.weather[0].description;
        const humidity = data.main.humidity;
    
        document.getElementById("result").innerHTML = `
        <h2>${name}</h2>
        <p><strong>Temperature:</strong> ${temperature} °C</p>
        <p><strong>Description:</strong> ${description}</p>
        <p><strong>Humidity:</strong> ${humidity}%</p>
        `;
    } catch (error) {
        document.getElementById("result").innerHTML = `Error: ${error.message}`;
    }
    }
    </script>

    </body>
    </html>
