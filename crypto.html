<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Country Info</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #1F4E79; }
    #result { background: #f7f9fc; border: 1px solid #d0dff0; border-radius: 8px; padding: 20px; margin-top: 20px; }
    button { background: #2E75B6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #1F4E79; }
  </style>
</head>
<body>

    <h1>Crypto Info</h1>
    <input type="text" id="cryptoInput" placeholder="Enter a cryptocurrency name" style="padding:8px; font-size:16px; width:250px;">
    <button onclick="loadCrypto()">Search</button>
    <div id="result">Enter a cryptocurrency name above and click Search.</div>

    <script>
async function loadCrypto() {
    const crypto = document.getElementById("cryptoInput").value.trim();
    
    if (!crypto) {
        document.getElementById("result").innerHTML = "Please enter a cryptocurrency name.";
        return;
    }
    
    document.getElementById("result").innerHTML = "Loading...";
    
    try {
        const response = await fetch(`https://api.coingecko.com/api/v3/coins/${crypto.toLowerCase()}`);
    
        if (!response.ok) {
        throw new Error(`Cryptocurrency not found (${response.status})`);
        }
    
        const data = await response.json();
    
        const name = data.name;
        const symbol = data.symbol.toUpperCase();
        const price = data.market_data.current_price.usd;
        const marketCap = data.market_data.market_cap.usd.toLocaleString();
        const change24h = data.market_data.price_change_percentage_24h;
    
        document.getElementById("result").innerHTML = `
        <h2>${name} (${symbol})</h2>
        <p><strong>Price:</strong> $${price}</p>
        <p><strong>Market Cap:</strong> $${marketCap}</p>
        <p><strong>24h Change:</strong> ${change24h.toFixed(2)}%</p>
        `;
    } catch (error) {
        document.getElementById("result").innerHTML = `Error: ${error.message}`;
    }
    }
    </script>

    </body>

    </html>
